
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RXYNOSCXN</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: #020204;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#stars {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 15px;
}

h1 {
  font-size: clamp(29px, 8vw, 62px);
  font-weight: 800;
  white-space: nowrap;
  color: #8F1728;
  text-shadow: 0 0 12px #8F172855;
  animation: glitch 4s infinite;
}

@keyframes glitch {
  0%, 90%, 100% { transform: translateX(0); }
  92% { transform: translateX(-2px); }
  94% { transform: translateX(2px); }
  96% { transform: translateX(0); }
}

.telegram {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 65px;
  padding: 17px 35px;
  border: 1px solid #168cff;
  border-radius: 50px;
  color: white;
  text-decoration: none;
  font-size: 20px;
  font-weight: bold;
  box-shadow: 0 0 18px #168cff22;
}

.telegram:active {
  background: #168cff;
}

.signature {
  margin-top: 65px;
  color: #777;
  font-size: 12px;
  letter-spacing: 5px;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="content">
  <h1>ZAMAN DARALIYOR...</h1>

  <a class="telegram" href="https://t.me/erildinw">
    <span>➤</span>
    <span>Telegram</span>
  </a>

  <div class="signature">rxynoscxn</div>
</div>

<script>
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
let stars = [];

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;

  stars = Array.from({length: 130}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.4,
    speed: Math.random() * 0.3 + 0.1
  }));
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  stars.forEach(s => {
    ctx.fillStyle = "rgba(143,23,40,0.8)";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();

    s.y += s.speed;

    if (s.y > canvas.height) {
      s.y = 0;
      s.x = Math.random() * canvas.width;
    }
  });

  requestAnimationFrame(animate);
}

resize();
animate();
window.addEventListener("resize", resize);
</script>

</body>
</html>
